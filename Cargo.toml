[package]
name = "orestra-conformance"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde_json = "1.0"
libc = "0.2"
sha1 = "0.10"
sha2 = "0.10"
wait-timeout = "0.2"

[dev-dependencies]
tempfile = "3"

[lib]
path = "reference/lib.rs"

[[bin]]
name = "conformance"
path = "scripts/run.rs"

[[bin]]
name = "run-native-sources"
path = "scripts/run_native_sources.rs"

[[bin]]
name = "verify-oreslang-private-carrier"
path = "scripts/verify-oreslang-private-carrier.rs"

[[bin]]
name = "verify-oreslang-external-anchor"
path = "scripts/verify-oreslang-external-anchor.rs"

[[bin]]
name = "verify-live-carrier"
path = "scripts/verify-live-carrier.rs"

[[test]]
name = "carrier-governance-policy"
path = "scripts/test-carrier-governance-policy.rs"

[[test]]
name = "oreslang-private-carrier"
path = "scripts/test-oreslang-private-carrier.rs"

[[test]]
name = "oreslang-external-anchor"
path = "scripts/test-oreslang-external-anchor.rs"

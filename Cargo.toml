[package]
name = "orestra-driver-tools"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
getrandom = "0.2"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
path = "reference/lib.rs"

[[bin]]
name = "orestra-driver-manifest"
path = "tools/driver-manifest/main.rs"

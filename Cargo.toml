[package]
name = "orestra-state-oracle"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

[lib]
path = "model/lib.rs"

[[bin]]
name = "bounded-fencing"
path = "formal/bounded_fencing.rs"

[[bin]]
name = "check-fencing"
path = "formal/check_fencing.rs"

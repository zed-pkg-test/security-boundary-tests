name: Conformance oracle
on:
  push:
    branches-ignore:
      - 'ci/oreslang-*'
      - 'ci/oreslang-control-*'
  pull_request:
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Reject Python owned by this repository
        shell: bash
        run: |
          set -euo pipefail
          found="$(git ls-files '*.py' ':!private-oreslang-source/**')"
          if [ -n "$found" ]; then
            echo "Python sources are prohibited; use Rust for conformance/reference tooling." >&2
            printf '%s\n' "$found" >&2
            exit 1
          fi
      - run: cargo test --all-targets

name: WASM desktop runtime integration

on:
  pull_request:
    paths:
      - '.github/workflows/wasm-desktop-runtime-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wasm-desktop-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain and WASI target
        run: |
          set -euo pipefail
          rustup toolchain install 1.96 --profile minimal --component clippy,rustfmt
          rustup target add wasm32-wasip1 --toolchain 1.96
          rustup default 1.96

      - name: Fetch exact runtime revisions
        run: |
          set -euo pipefail
          git clone https://github.com/wasm-xprs/wasmx-desktop-daemon.git "$RUNNER_TEMP/wasmx-daemon"
          git -C "$RUNNER_TEMP/wasmx-daemon" checkout d8999b344ff5fdb703fb037a4dffeeda60baed36

          git clone https://github.com/wasm-xprs/wasmx-desktop-cli.git "$RUNNER_TEMP/wasmx-cli"
          git -C "$RUNNER_TEMP/wasmx-cli" checkout 5179e4db75ec9d4eaebd867860b73296979b88ff

          git clone https://github.com/lunatic-lorry/ll-desktop-daemon.git "$RUNNER_TEMP/ll-daemon"
          git -C "$RUNNER_TEMP/ll-daemon" checkout 49a883262728cef5429c570832af9b506ae9279d

          git clone https://github.com/lunatic-lorry/ll-desktop-cli.git "$RUNNER_TEMP/ll-cli"
          git -C "$RUNNER_TEMP/ll-cli" checkout 99773d6c378a0bf8a112c7c7b8f9520eb3c2b8b8

      - name: Build locked desktop daemons and CLIs
        run: |
          set -euo pipefail
          cargo build --locked --manifest-path "$RUNNER_TEMP/wasmx-daemon/Cargo.toml"
          cargo build --locked --manifest-path "$RUNNER_TEMP/wasmx-cli/Cargo.toml"
          cargo build --locked --manifest-path "$RUNNER_TEMP/ll-daemon/Cargo.toml"
          cargo build --locked --manifest-path "$RUNNER_TEMP/ll-cli/Cargo.toml"

      - name: Build independent Lunatic mailbox fixture for wasm32-wasip1
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ll-fixture/src"
          cat >"$RUNNER_TEMP/ll-fixture/Cargo.toml" <<'EOF'
          [package]
          name = "ll-test-fixture"
          version = "0.0.0"
          edition = "2021"
          publish = false

          [dependencies]
          lunatic = "=0.14.1"
          EOF
          cat >"$RUNNER_TEMP/ll-fixture/src/main.rs" <<'EOF'
          use lunatic::Mailbox;
          use std::io::{self, Write};

          #[lunatic::main]
          fn main(mailbox: Mailbox<Vec<u8>>) {
              let payload = match mailbox.try_receive() {
                  Ok(payload) => payload,
                  Err(_) => std::process::exit(65),
              };
              let mut stdout = io::stdout();
              if stdout.write_all(&payload).is_err() {
                  std::process::exit(74);
              }
              if stdout.flush().is_err() {
                  std::process::exit(74);
              }
          }
          EOF
          cargo generate-lockfile --manifest-path "$RUNNER_TEMP/ll-fixture/Cargo.toml"
          cargo build --locked --release --target wasm32-wasip1 --manifest-path "$RUNNER_TEMP/ll-fixture/Cargo.toml"
          mapfile -t ll_modules < <(find "$RUNNER_TEMP/ll-fixture/target/wasm32-wasip1/release" -maxdepth 1 -type f -name '*.wasm' -print | sort)
          if [ "${#ll_modules[@]}" -ne 1 ]; then
            echo "expected exactly one Lunatic fixture Wasm artifact, found ${#ll_modules[@]}" >&2
            printf '  %s\n' "${ll_modules[@]}" >&2
            exit 1
          fi
          LL_MODULE="${ll_modules[0]}"
          test -s "$LL_MODULE"
          cp "$LL_MODULE" "$RUNNER_TEMP/ll-module-a.wasm"
          cp "$LL_MODULE" "$RUNNER_TEMP/ll-module-b.wasm"
          # Add a valid custom section so module-b remains valid Wasm but has different bytes.
          printf '\x00\x07\x05driftx' >>"$RUNNER_TEMP/ll-module-b.wasm"
          test "$(sha256sum "$RUNNER_TEMP/ll-module-a.wasm" | cut -d' ' -f1)" != "$(sha256sum "$RUNNER_TEMP/ll-module-b.wasm" | cut -d' ' -f1)"

      - name: Generate valid wasmx-v1 guest fixtures
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/watgen/src"
          cat >"$RUNNER_TEMP/watgen/Cargo.toml" <<'EOF'
          [package]
          name = "wasmx-test-watgen"
          version = "0.0.0"
          edition = "2024"
          publish = false

          [dependencies]
          anyhow = "1"
          wat = "1"
          EOF
          cat >"$RUNNER_TEMP/watgen/src/main.rs" <<'EOF'
          use anyhow::Result;

          fn main() -> Result<()> {
              let wasm = wat::parse_str(
                  r#"(module
                      (import "wasmx" "output_write" (func $output_write (param i32 i32) (result i32)))
                      (memory (export "memory") 1)
                      (data (i32.const 0) "{}")
                      (func (export "wasmx_main") (result i32)
                          i32.const 0
                          i32.const 2
                          call $output_write
                          drop
                          i32.const 0))"#,
              )?;
              let Some(output) = std::env::args().nth(1) else {
                  anyhow::bail!("output path is required");
              };
              std::fs::write(output, wasm)?;
              return Ok(());
          }
          EOF
          cargo run --quiet --manifest-path "$RUNNER_TEMP/watgen/Cargo.toml" -- "$RUNNER_TEMP/wasmx-module-a.wasm"
          cp "$RUNNER_TEMP/wasmx-module-a.wasm" "$RUNNER_TEMP/wasmx-module-b.wasm"
          printf '\x00\x01\x00' >>"$RUNNER_TEMP/wasmx-module-b.wasm"
          test "$(sha256sum "$RUNNER_TEMP/wasmx-module-a.wasm" | cut -d' ' -f1)" != "$(sha256sum "$RUNNER_TEMP/wasmx-module-b.wasm" | cut -d' ' -f1)"

      - name: Launch both desktop daemons on canonical unique ports
        run: |
          set -euo pipefail

          WASMX_HOME="$RUNNER_TEMP/wasmx-home"
          LL_HOME="$RUNNER_TEMP/ll-home"
          mkdir -p "$WASMX_HOME" "$LL_HOME"

          (
            export HOME="$WASMX_HOME"
            cd "$RUNNER_TEMP/wasmx-daemon"
            WASMX_DESKTOP_ADDR=127.0.0.1:8766 \
            WASMX_ARTIFACT_ROOT="$HOME/.wasm-xprs/artifacts" \
            WASMX_DESKTOP_TOKEN_FILE="$HOME/.wasm-xprs/daemon/token" \
              target/debug/wasmx-desktop-daemon >"$RUNNER_TEMP/wasmx-daemon.log" 2>&1
          ) &
          echo $! >"$RUNNER_TEMP/wasmx-daemon.pid"

          (
            export HOME="$LL_HOME"
            cd "$RUNNER_TEMP/ll-daemon"
            LL_DESKTOP_ADDR=127.0.0.1:8763 \
            LL_DESKTOP_TOKEN_FILE="$HOME/.lunatic-lorry/daemon/token" \
              target/debug/ll-desktop-daemon >"$RUNNER_TEMP/ll-daemon.log" 2>&1
          ) &
          echo $! >"$RUNNER_TEMP/ll-daemon.pid"

          for _ in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:8766/healthz >/dev/null \
              && curl --fail --silent http://127.0.0.1:8763/healthz >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/wasmx-daemon.log" || true
          cat "$RUNNER_TEMP/ll-daemon.log" || true
          exit 1

      - name: Prove collision-free ports, private tokens, and auth boundaries
        run: |
          set -euo pipefail
          test "$(stat -c '%a' "$RUNNER_TEMP/wasmx-home/.wasm-xprs/daemon/token")" = "600"
          test "$(stat -c '%a' "$RUNNER_TEMP/ll-home/.lunatic-lorry/daemon/token")" = "600"

          curl --fail --silent http://127.0.0.1:8766/healthz >/dev/null
          curl --fail --silent http://127.0.0.1:8763/healthz >/dev/null

          if curl --fail --silent --connect-timeout 1 http://127.0.0.1:8765/healthz >/dev/null 2>&1; then
            echo 'unexpected listener remains on legacy port 8765' >&2
            exit 1
          fi

          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8766/v1/status)" = "401"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8763/v1/status)" = "401"

      - name: Prove wasm-xprs deploy, invoke, and immutable generation semantics
        env:
          WASMX_DESKTOP_FLAGS_CONFIG: ${{ runner.temp }}/wasmx-cli/.cli-flags.toml
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/wasmx-home"
          CLI="$RUNNER_TEMP/wasmx-cli/target/debug/wasmx-desktop-cli"

          "$CLI" doctor
          "$CLI" deploy --tenant wasmx-tenant --deployment generation-1 --module "$RUNNER_TEMP/wasmx-module-a.wasm"
          "$CLI" invoke --tenant wasmx-tenant --deployment generation-1 --payload '{"source":"zed-pkg-test","runtime":"wasmx"}'
          "$CLI" deploy --tenant wasmx-tenant --deployment generation-1 --module "$RUNNER_TEMP/wasmx-module-a.wasm"

          if "$CLI" deploy --tenant wasmx-tenant --deployment generation-1 --module "$RUNNER_TEMP/wasmx-module-b.wasm"; then
            echo 'wasm-xprs immutable generation unexpectedly accepted byte drift' >&2
            exit 1
          fi

          "$CLI" inspect --tenant wasmx-tenant --deployment generation-1

      - name: Prove live Lunatic deploy, invoke, and immutable generation semantics
        env:
          LL_DESKTOP_FLAGS_CONFIG: ${{ runner.temp }}/ll-cli/.cli-flags.toml
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/ll-home"
          CLI="$RUNNER_TEMP/ll-cli/target/debug/ll-desktop-cli"

          "$CLI" status
          "$CLI" deploy --tenant ll-tenant-a --deployment generation-1 --module "$RUNNER_TEMP/ll-module-a.wasm"
          "$CLI" invoke --tenant ll-tenant-a --deployment generation-1 --payload '{"source":"zed-pkg-test","runtime":"lunatic","tenant":"a"}' | tee "$RUNNER_TEMP/ll-invoke-a.json"
          grep -F '"tenant": "a"' "$RUNNER_TEMP/ll-invoke-a.json"

          "$CLI" deploy --tenant ll-tenant-a --deployment generation-1 --module "$RUNNER_TEMP/ll-module-a.wasm"
          if "$CLI" deploy --tenant ll-tenant-a --deployment generation-1 --module "$RUNNER_TEMP/ll-module-b.wasm"; then
            echo 'Lunatic immutable generation unexpectedly accepted byte drift' >&2
            exit 1
          fi

          "$CLI" deploy --tenant ll-tenant-b --deployment generation-1 --module "$RUNNER_TEMP/ll-module-a.wasm"
          "$CLI" invoke --tenant ll-tenant-b --deployment generation-1 --payload '{"source":"zed-pkg-test","runtime":"lunatic","tenant":"b"}' | tee "$RUNNER_TEMP/ll-invoke-b.json"
          grep -F '"tenant": "b"' "$RUNNER_TEMP/ll-invoke-b.json"

      - name: Stress fresh Lunatic actors across tenants in one resident process
        env:
          LL_DESKTOP_FLAGS_CONFIG: ${{ runner.temp }}/ll-cli/.cli-flags.toml
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/ll-home"
          CLI="$RUNNER_TEMP/ll-cli/target/debug/ll-desktop-cli"
          export CLI

          mkdir -p "$RUNNER_TEMP/ll-parallel"
          for i in $(seq 1 8); do
            (
              "$CLI" invoke --tenant ll-tenant-a --deployment generation-1 \
                --payload "{\"tenant\":\"a\",\"request\":$i}" \
                >"$RUNNER_TEMP/ll-parallel/a-$i.json"
            ) &
            (
              "$CLI" invoke --tenant ll-tenant-b --deployment generation-1 \
                --payload "{\"tenant\":\"b\",\"request\":$i}" \
                >"$RUNNER_TEMP/ll-parallel/b-$i.json"
            ) &
          done
          wait

          for i in $(seq 1 8); do
            grep -F '"tenant": "a"' "$RUNNER_TEMP/ll-parallel/a-$i.json"
            grep -F "\"request\": $i" "$RUNNER_TEMP/ll-parallel/a-$i.json"
            grep -F '"tenant": "b"' "$RUNNER_TEMP/ll-parallel/b-$i.json"
            grep -F "\"request\": $i" "$RUNNER_TEMP/ll-parallel/b-$i.json"
          done

          kill -0 "$(cat "$RUNNER_TEMP/ll-daemon.pid")"
          kill -0 "$(cat "$RUNNER_TEMP/wasmx-daemon.pid")"

      - name: Assert both CLI defaults match canonical fleet ports
        run: |
          set -euo pipefail
          grep -F 'default = "http://127.0.0.1:8766"' "$RUNNER_TEMP/wasmx-cli/.cli-flags.toml"
          grep -F 'default = "http://127.0.0.1:8763"' "$RUNNER_TEMP/ll-cli/.cli-flags.toml"

      - name: Re-prove Lunatic daemon source gates on independent test-org runner
        run: |
          set -euo pipefail
          cargo fmt --all --manifest-path "$RUNNER_TEMP/ll-daemon/Cargo.toml" -- --check
          cargo test --locked --all-targets --manifest-path "$RUNNER_TEMP/ll-daemon/Cargo.toml"
          cargo clippy --locked --all-targets --manifest-path "$RUNNER_TEMP/ll-daemon/Cargo.toml" -- -D warnings

      - name: Stop daemons
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/wasmx-daemon.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/wasmx-daemon.pid")" 2>/dev/null || true
          fi
          if [ -f "$RUNNER_TEMP/ll-daemon.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/ll-daemon.pid")" 2>/dev/null || true
          fi

      - name: Dump daemon logs on failure
        if: failure()
        run: |
          echo '--- wasm-xprs daemon ---'
          cat "$RUNNER_TEMP/wasmx-daemon.log" 2>/dev/null || true
          echo '--- Lunatic daemon ---'
          cat "$RUNNER_TEMP/ll-daemon.log" 2>/dev/null || true

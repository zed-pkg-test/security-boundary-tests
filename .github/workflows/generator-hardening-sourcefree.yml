name: Generator hardening source-free canary

on:
  pull_request:
    paths:
      - '.github/workflows/generator-hardening-sourcefree.yml'
      - 'generator-hardening/**'

permissions:
  contents: read

jobs:
  generator-hardening:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Verify no private Oreslang mirror exists
        shell: bash
        run: |
          set -euo pipefail
          test ! -e private-oreslang-source
          node --version
      - name: Exercise generator hardening invariants
        run: node --test generator-hardening/source-free-generator-hardening.test.mjs

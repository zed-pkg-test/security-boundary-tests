name: Peer-authority security canary

on:
  pull_request:
    paths:
      - 'fixtures/peer-authority-security/**'
      - '.github/workflows/peer-authority-security.yml'
  push:
    branches: [main]
    paths:
      - 'fixtures/peer-authority-security/**'
      - '.github/workflows/peer-authority-security.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: peer-authority-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  no-authority-precedence:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Require test-org execution and independent sources
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_REPOSITORY_OWNER" in *-test) ;; *) exit 1 ;; esac
          test -s fixtures/peer-authority-security/main.tsp
          test -s fixtures/peer-authority-security/authored.schema.json
          grep -Fq 'https://json-schema.org/draft/2020-12/schema' fixtures/peer-authority-security/authored.schema.json

      - name: Generate Schema B and compare peer authorities
        uses: ORESoftware/typespec-json-schema-validator@5b04b08512f8a03a376dcb96818969e2d83c2d84
        with:
          typespec: fixtures/peer-authority-security/main.tsp
          schema: fixtures/peer-authority-security/authored.schema.json
          report: .typespec-json-schema-validator/security-report.json
          contract_ir: .typespec-json-schema-validator/security-contract-ir.json
          output_dir: .typespec-json-schema-validator/security-generated
          max_probes: '64'

      - name: Assert receipt has two independent authorities and no precedence
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('.typespec-json-schema-validator/security-report.json', 'utf8'));
          const fail = message => { throw new Error(message); };
          report.authorities?.typespec?.authority === 'independently-authored' || fail('TypeSpec authority was demoted');
          report.authorities?.jsonSchema?.authority === 'independently-authored' || fail('JSON Schema authority was demoted');
          report.authorities?.jsonSchema?.dialect === 'https://json-schema.org/draft/2020-12/schema' || fail('JSON Schema dialect drifted');
          report.authorities?.precedence === 'none' || fail('one authority gained precedence');
          report.authorities?.typespec?.generatedJsonSchemaRole === 'comparison-evidence-only' || fail('generated Schema B gained authority');
          report.coverage?.typespecGeneratedJsonSchemaComparison === true || fail('Schema B comparison did not run');
          report.status === 'passed' || fail(`unexpected parity status: ${report.status}`);
          NODE

      - name: Prove generated witness stayed out of authored source tree
        shell: bash
        run: |
          set -euo pipefail
          test -s .typespec-json-schema-validator/security-generated/typespec.generated.schema.json
          test ! -e fixtures/peer-authority-security/typespec.generated.schema.json
          git diff --exit-code -- fixtures/peer-authority-security/

      - name: Retain parity evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: peer-authority-security-${{ github.run_id }}
          path: .typespec-json-schema-validator/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

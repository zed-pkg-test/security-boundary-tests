name: API contract checks
on: [push, pull_request]
permissions: {contents: read}
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Reject Python sources
        run: |
          if find . -type f -name '*.py' -print -quit | grep -q .; then
            echo "Python sources are prohibited; use Rust for API reference tooling/tests." >&2
            find . -type f -name '*.py' -print >&2
            exit 1
          fi
      - run: cargo run --bin validate-api-contracts
      - run: cargo test --all-targets

name: Public cross-org Git object integrity probe (no private source)
on:
  push:
    branches:
      - audit/oreslang-source-free-runner-probe-20261027
permissions:
  contents: read
jobs:
  verify-public-mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout this test repo only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify exact public cross-org blob and Git mode
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "zed-pkg-test/security-boundary-tests"
          test "$GITHUB_EVENT_NAME" = "push"
          test "$GITHUB_REF" = "refs/heads/audit/oreslang-source-free-runner-probe-20261027"
          test -z "${GITHUB_TOKEN:-}"
          test -z "${GH_TOKEN:-}"
          expected="4b4818ebeecff50619c808c6844eb4a774951e27"
          test "$(git hash-object mirror-fixture/README.md)" = "$expected"
          observed="$(git ls-tree HEAD mirror-fixture/README.md)"
          test "$observed" = "$(printf '100644 blob %s\tmirror-fixture/README.md' "$expected")"
          test -f mirror-fixture/README.md
          echo "PUBLIC_CROSS_ORG_BLOB_SHA_VERIFIED=$expected"
          echo "PRIVATE_ORESLANG_BLOBS_COPIED=false"
          echo "ALT_GITHUB_ACTIONS_EXECUTION_VERIFIED=true"

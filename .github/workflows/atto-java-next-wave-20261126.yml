name: Atto Java parser baseline and select mainline integration
on:
  push:
    branches: [validation/atto-java-parity-wave-20261126]
    paths: ['.github/workflows/atto-java-next-wave-20261126.yml']
permissions: {}
jobs:
  exact-java:
    name: PR ${{ matrix.pr }} focused JVM tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - pr: 1940
            head: 'a6a2e91e802bc9d5be2422e6925cde2ace86844b'
            tree: 'b4899b3cd4e3849c13f5784396f855e197f39db8'
            tests: 'ParserTest,OwnershipBangAliasesTest,BangKeywordWhitespaceTest,StrictImplicitConversionTest'
          - pr: 1941
            head: 'b2916a1c64fb11edd85472dc5680216168c4d719'
            tree: '1fde22a3486feda7af36cc172fb6a274e4ac91fa'
            tests: 'TypedDefaultSelectGuestTest,CountedSelectTaskCursorTest,AttoXoCheckedDebitTest,OwnershipBangAliasesTest'
    env:
      EXPECTED_HEAD: ${{ matrix.head }}
      EXPECTED_TREE: ${{ matrix.tree }}
      TESTS: ${{ matrix.tests }}
      PR_NUMBER: ${{ matrix.pr }}
    steps:
      - name: Fetch and verify complete public Git tree (no credentials)
        shell: bash
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          git init source
          git -C source -c credential.helper= fetch --no-tags --depth=1 https://github.com/atto-lang/atto-source.java.git "$EXPECTED_HEAD"
          git -C source checkout --detach FETCH_HEAD
          actual_head="$(git -C source rev-parse HEAD)"
          actual_tree="$(git -C source rev-parse 'HEAD^{tree}')"
          index_tree="$(git -C source write-tree)"
          printf 'OBSERVED_HEAD_TREE|%s|expected=%s,%s|actual=%s,%s,%s\n' "$PR_NUMBER" "$EXPECTED_HEAD" "$EXPECTED_TREE" "$actual_head" "$actual_tree" "$index_tree"
          test "$actual_head" = "$EXPECTED_HEAD"
          test "$actual_tree" = "$EXPECTED_TREE"
          test "$index_tree" = "$EXPECTED_TREE"
          git -C source diff --exit-code
          git -C source fsck --full
          test -z "$(git -C source status --porcelain)"
          printf 'EXACT_HEAD_TREE|%s|%s|%s\n' "$PR_NUMBER" "$EXPECTED_HEAD" "$EXPECTED_TREE"
      - name: Compile and execute relevant JUnit and guest tests
        shell: bash
        run: |
          set -euo pipefail
          cd source
          export JAVA_HOME="$JAVA_HOME_21_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          java -version
          mvn -B -ntp -Dtest="$TESTS" -DfailIfNoTests=true -Dsurefire.failIfNoSpecifiedTests=true test
          IFS=, read -ra classes <<< "$TESTS"
          for class in "${classes[@]}"; do
            report="$(find target/surefire-reports -name "TEST-*.${class}.xml" -print -quit)"
            test -n "$report"
            grep -Eq 'tests="[1-9][0-9]*"' "$report"
            grep -Eq 'failures="0"' "$report"
            grep -Eq 'errors="0"' "$report"
            grep -Eq 'skipped="0"' "$report"
          done
          git diff --exit-code
          git diff --cached --exit-code
          printf 'FOCUSED_JVM_PASS|%s|%s|%s|%s\n' "$PR_NUMBER" "$EXPECTED_HEAD" "$EXPECTED_TREE" "$TESTS"
